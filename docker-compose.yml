version: '3.8'

services:
  # Frontend приложение
  frontend:
    build:
      context: .
      dockerfile: Dockerfile # Assumes a Dockerfile exists in the root for the frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend

  # Backend сервер (Python/FastAPI)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - API_KEY=your_secret_api_key # Change this in production
    depends_on:
      - mongodb
      - redis
      - neo4j

  # Neo4j Database
  neo4j:
    image: neo4j:4.4
    ports:
      - "7474:7474" # Browser interface
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/password

  # MongoDB
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # IPFS
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8081:8080" # Port changed to 8081 to avoid conflict with other services
    volumes:
      - ipfs_data:/data/ipfs

  # Ethereum node (для разработки)
  ethereum:
    image: trufflesuite/ganache:latest
    ports:
      - "8545:8545"
    volumes:
      - ganache_data:/data/ganache

volumes:
  neo4j_data:
  mongodb_data:
  redis_data:
  ipfs_data:
  ganache_data: 